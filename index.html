<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dar Al Arqum | IBAN</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#fbf7ee,#f6eff8 68%,#eee1d4);font-family:Arial,sans-serif;color:#4b3451;text-align:center}.card{width:min(100%,450px);background:#fffdf9;border:1px solid #d8b989;border-radius:22px;padding:26px 23px 30px;box-shadow:0 12px 35px #65436a1b}.logo{display:block;width:100%;max-width:330px;margin:0 auto 18px;object-fit:contain}.rule{height:2px;width:85px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,#b58b52,transparent)}h1{font-size:22px;color:#653879;margin:0 0 8px}h2{font-size:19px;color:#653879;margin:0 0 20px;font-weight:600}p{line-height:1.7;margin:10px 0;color:#685b65}.label{font-weight:700;color:#775c41}.iban{margin:15px 0 18px;padding:16px 10px;border:1px solid #d8b989;border-radius:12px;background:#f8f1e8;font-weight:700;font-size:17px;overflow-wrap:anywhere;letter-spacing:.3px;color:#4d315d}button{width:100%;background:#653879;color:white;border:1px solid #b58b52;border-radius:11px;padding:16px;font-size:17px;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #b58b52;outline-offset:3px}#status{min-height:26px;font-size:14px;font-weight:bold;color:#287c48}.instructions{font-size:14px}
</style></head><body><main class="card"><img class="logo" src="logo.png" alt="Dar Al Arqum Quranic Studies Centre official logo"><div class="rule"></div><h1>BenefitPay Transfer Details</h1><h2 lang="ar" dir="rtl">بيانات التحويل عبر بنفت</h2><p class="label">IBAN Number | رقم الآيبان</p><div class="iban" id="iban">BH96BIBB00100000158658</div><button type="button" onclick="copyIban()">Copy IBAN | نسخ الآيبان</button><p id="status" role="status" aria-live="polite"></p><p class="instructions">Copy the IBAN and paste it into BenefitPay to complete your transfer.</p><p class="instructions" lang="ar" dir="rtl">انسخي رقم الآيبان والصقيه في تطبيق بنفت لإتمام التحويل.</p></main><script>
async function copyIban(){const v=document.getElementById('iban').textContent.trim(),s=document.getElementById('status');try{await navigator.clipboard.writeText(v);s.textContent='IBAN copied successfully ✓ | تم نسخ الآيبان';}catch(e){const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();const ok=document.execCommand('copy');t.remove();s.textContent=ok?'IBAN copied successfully ✓ | تم نسخ الآيبان':'Please select and copy the IBAN manually | يُرجى نسخ الآيبان يدويًا';}}
</script></body></html>
